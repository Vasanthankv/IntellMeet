# Render Blueprint Specification for IntellMeet
# Automatically configures Fullstack Live Deployment on Render (100% Free Tier)

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. IntellMeet Backend API & Real-time WebRTC/Socket.IO Server
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: intellmeet-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FRONTEND_URL
        value: https://intellmeet-frontend-5khf.onrender.com


  # ─────────────────────────────────────────────────────────────────────────────
  # 2. IntellMeet Frontend Single Page App (Static Site - Free, Fast CDN, 0 Sleep)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: intellmeet-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://intellmeet-backend-rc32.onrender.com
